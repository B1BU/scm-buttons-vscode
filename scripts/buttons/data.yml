# Icon reference: https://microsoft.github.io/vscode-codicons/dist/codicon.html

# General
GitRefresh:
  command: git.refresh
  default: true
  icon: refresh
  title: Refresh
  when: scmProvider == git
GitShowOutput:
  command: git.showOutput
  default: false
  icon: output
  title: Show Git Output
  when: scmProvider == git
GitCheckout:
  command: git.checkout
  default: false
  icon: git-commit
  title: Checkout to...
  when: scmProvider == git

# Changes
GitStageAll:
  command: git.stageAll
  default: false
  icon: add
  title: Stage All Changes
  when: scmProvider == git
GitUnstageAll:
  command: git.unstageAll
  default: false
  icon: remove
  title: Unstage All Changes
  when: scmProvider == git
GitCleanAll:
  command: git.cleanAll
  default: false
  icon: discard
  title: Discard All Changes
  when: scmProvider == git

